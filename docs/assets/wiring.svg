<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc">
<title id="title">Headway ESP32-C3 Super Mini to MSP3218 display wiring</title>
<desc id="desc">Nine connections from the ESP32-C3 to the ILI9341 display. Touch and SD pins are unused.</desc>
<rect width="1000" height="670" rx="22" fill="#101c32"/>
<text x="42" y="63" fill="#f6ce46" font-size="31" font-family="Arial,sans-serif" font-weight="bold">The nine wires</text>
<text x="42" y="99" fill="#b9c7db" font-size="18" font-family="Arial,sans-serif">ESP32-C3 Super Mini → MSP3218 ILI9341 TFT</text>
<text x="42" y="148" fill="#fff" font-size="20" font-family="Arial,sans-serif" font-weight="bold">BOARD</text>
<text x="330" y="148" fill="#fff" font-size="20" font-family="Arial,sans-serif" font-weight="bold">DISPLAY</text>
<text x="650" y="148" fill="#fff" font-size="20" font-family="Arial,sans-serif" font-weight="bold">WHY</text>
<rect x="32" y="162" width="936" height="40" rx="7" fill="#182842"/>
<text x="47" y="191" fill="#f5d967" font-size="20" font-family="Arial,sans-serif" font-weight="bold">3V3</text>
<path d="M 213 184 H 296" stroke="#7890b5" stroke-width="2"/>
<text x="331" y="191" fill="#f7f9fc" font-size="20" font-family="Arial,sans-serif">VCC</text>
<text x="650" y="191" fill="#b9c7db" font-size="18" font-family="Arial,sans-serif">Display logic</text>
<rect x="32" y="206" width="936" height="40" rx="7" fill="#14223a"/>
<text x="47" y="235" fill="#f5d967" font-size="20" font-family="Arial,sans-serif" font-weight="bold">GND</text>
<path d="M 213 228 H 296" stroke="#7890b5" stroke-width="2"/>
<text x="331" y="235" fill="#f7f9fc" font-size="20" font-family="Arial,sans-serif">GND</text>
<text x="650" y="235" fill="#b9c7db" font-size="18" font-family="Arial,sans-serif">Common ground</text>
<rect x="32" y="250" width="936" height="40" rx="7" fill="#182842"/>
<text x="47" y="279" fill="#f5d967" font-size="20" font-family="Arial,sans-serif" font-weight="bold">5V</text>
<path d="M 213 272 H 296" stroke="#7890b5" stroke-width="2"/>
<text x="331" y="279" fill="#f7f9fc" font-size="20" font-family="Arial,sans-serif">LED</text>
<text x="650" y="279" fill="#b9c7db" font-size="18" font-family="Arial,sans-serif">Backlight on this build</text>
<rect x="32" y="294" width="936" height="40" rx="7" fill="#14223a"/>
<text x="47" y="323" fill="#f5d967" font-size="20" font-family="Arial,sans-serif" font-weight="bold">GPIO 7</text>
<path d="M 213 316 H 296" stroke="#7890b5" stroke-width="2"/>
<text x="331" y="323" fill="#f7f9fc" font-size="20" font-family="Arial,sans-serif">CS</text>
<text x="650" y="323" fill="#b9c7db" font-size="18" font-family="Arial,sans-serif">Chip select</text>
<rect x="32" y="338" width="936" height="40" rx="7" fill="#182842"/>
<text x="47" y="367" fill="#f5d967" font-size="20" font-family="Arial,sans-serif" font-weight="bold">GPIO 10</text>
<path d="M 213 360 H 296" stroke="#7890b5" stroke-width="2"/>
<text x="331" y="367" fill="#f7f9fc" font-size="20" font-family="Arial,sans-serif">RESET</text>
<text x="650" y="367" fill="#b9c7db" font-size="18" font-family="Arial,sans-serif">Panel reset</text>
<rect x="32" y="382" width="936" height="40" rx="7" fill="#14223a"/>
<text x="47" y="411" fill="#f5d967" font-size="20" font-family="Arial,sans-serif" font-weight="bold">GPIO 3</text>
<path d="M 213 404 H 296" stroke="#7890b5" stroke-width="2"/>
<text x="331" y="411" fill="#f7f9fc" font-size="20" font-family="Arial,sans-serif">DC / RS</text>
<text x="650" y="411" fill="#b9c7db" font-size="18" font-family="Arial,sans-serif">Data or command</text>
<rect x="32" y="426" width="936" height="40" rx="7" fill="#182842"/>
<text x="47" y="455" fill="#f5d967" font-size="20" font-family="Arial,sans-serif" font-weight="bold">GPIO 6</text>
<path d="M 213 448 H 296" stroke="#7890b5" stroke-width="2"/>
<text x="331" y="455" fill="#f7f9fc" font-size="20" font-family="Arial,sans-serif">SDI / MOSI</text>
<text x="650" y="455" fill="#b9c7db" font-size="18" font-family="Arial,sans-serif">SPI data out</text>
<rect x="32" y="470" width="936" height="40" rx="7" fill="#14223a"/>
<text x="47" y="499" fill="#f5d967" font-size="20" font-family="Arial,sans-serif" font-weight="bold">GPIO 4</text>
<path d="M 213 492 H 296" stroke="#7890b5" stroke-width="2"/>
<text x="331" y="499" fill="#f7f9fc" font-size="20" font-family="Arial,sans-serif">SCK</text>
<text x="650" y="499" fill="#b9c7db" font-size="18" font-family="Arial,sans-serif">SPI clock</text>
<rect x="32" y="514" width="936" height="40" rx="7" fill="#182842"/>
<text x="47" y="543" fill="#f5d967" font-size="20" font-family="Arial,sans-serif" font-weight="bold">GPIO 5</text>
<path d="M 213 536 H 296" stroke="#7890b5" stroke-width="2"/>
<text x="331" y="543" fill="#f7f9fc" font-size="20" font-family="Arial,sans-serif">SDO / MISO</text>
<text x="650" y="543" fill="#b9c7db" font-size="18" font-family="Arial,sans-serif">SPI data in</text>
<text x="42" y="621" fill="#b9c7db" font-size="17" font-family="Arial,sans-serif">BOOT = GPIO 9: tap for next page; hold 3 s for setup. Touch / SD pins are unused.</text>
<text x="42" y="646" fill="#b9c7db" font-size="15" font-family="Arial,sans-serif">Logical wiring map · check the labels on your particular module before powering it.</text>
</svg>